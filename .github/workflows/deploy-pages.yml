name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Validate content
        run: node scripts/validate-content.mjs
      - name: Run regression tests
        run: |
          node scripts/test-content-validation.mjs
          node scripts/test-activity-filters.cjs
      - name: Build approved public site
        run: node scripts/build-static.mjs
      - name: Verify public-build boundary
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test ! -e dist/docs
          test ! -e dist/deploy
          test ! -e dist/server
          test ! -e dist/data/reflections
          test ! -e dist/tools
          test ! -e dist/data/seasons/index.json
          test ! -e dist/assets/js/development.js
          test ! -e dist/assets/js/seasons.js
          ! rg -q 'assets/js/development\.js' dist/index.html
          ! rg -q 'assets/js/seasons\.js' dist/index.html
          ! rg -q 'href="#reflect"|route==="reflect"|function showReflect' dist/assets/js/dynamic.js
      - name: Remove Cloudflare-only _headers file
        run: rm -f dist/_headers
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
