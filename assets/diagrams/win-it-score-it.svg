<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc"><title id="title">Win It, Score It setup</title><desc id="desc">An attacker and defender play between opposite goals and can counter in either direction.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#fff"/></marker></defs><rect width="640" height="320" rx="20" fill="#146b49"/><g fill="none" stroke="#fff" stroke-width="4"><rect x="55" y="28" width="530" height="264"/><path d="M55 112h28v96H55M585 112h-28v96h28"/><path d="M244 160Q165 150 92 160M360 160Q458 145 548 160" stroke-dasharray="11 9" marker-end="url(#a)"/></g><circle cx="268" cy="160" r="15" fill="#ff9b70" stroke="#10231a" stroke-width="3"/><path d="M335 145l18 30m0-30l-18 30" stroke="#d9ee5f" stroke-width="8" stroke-linecap="round"/><circle cx="287" cy="147" r="7" fill="#fff" stroke="#10231a" stroke-width="2"/><text x="268" y="205" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">attacker</text><text x="345" y="205" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">defender</text><text x="320" y="310" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">Win the ball → attack the opposite goal</text></svg>
